<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline | Ajanta Prakashan</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#fdf4ec; font-family: Georgia, 'Times New Roman', serif; color:#1f242c; }
  .box { text-align:center; padding:2rem; max-width:26rem; }
  h1 { font-size:1.4rem; margin-bottom:.5rem; }
  p { color:#4a5563; line-height:1.5; }
  button { margin-top:1.5rem; padding:.6rem 1.4rem; border-radius:.5rem; border:none; background:#b5651d; color:white; font-size:.95rem; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>You are offline</h1>
    <p>Some information may be unavailable. Please reconnect to the internet to view the latest conferences, events and notifications.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
